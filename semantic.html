<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic elements</title>
    <style>
        nav ul{
           background-color: cadetblue; 
           display: flex;  /* horizontal view*/ 
           list-style-type: none;  /* to remove dot*/
          justify-content: space-between;  /* to get space inbetween menu*/
        }
       a{
            text-decoration: none;
        }
        h2{
            color: blue;
        }
        .sec1{
            background-color: chocolate;
        }
        .sec2{
            background-color: crimson;
        }
        footer{
            text-align: center;
            color: darkgreen;
        }
    </style>
</head>
<body>
    <header>
        <h1>My first website in a strucutred format</h1>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About us</a></li>
                <li><a href="#">Products</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">Contact us</a></li>
            </ul>
        </nav>
    </header>
    <article>
        <h2><u>Article</u></h2>
        <p>It is used to represent as blogs or post</p>
    </article>
    <div>
        <section class="sec1">
            <h3>div tag</h3>
            <p>group and style elements together</p>
        </section>
        <section class="sec2">
            <h3>div tag</h3>
            <p>grouping tags and related contents within webpage</p>
        </section>
    </div>
    <footer>
        WWW.google.com || 9874563214
    </footer>
</body>
</html>
