<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Types of list</title>
  </head>
  <body>
    <!-- Unordered list -->
    <h3>Front End-MERN Stack</h3>
    <ul style="list-style-type: upper-roman">
      <li>HTML</li>
      <li>CSS</li>
      <li>Javascript</li>
      <li>React</li>
    </ul>
    <!-- Ordered list -->
    <h2>BaCK-END</h2>
    <ol type="I">
      <li>Node.js</li>
      <li>Express.js</li>
      <li>MongoDB</li>
    </ol>
    <!-- Description Lists -->
    <dl>
      <h3>Car</h3>
      <!-- ecription term -->
      <dt style="color: blueviolet;">Audi</dt>
      <dd>It is a red coloured automatic EV car</dd>
      <dt style="color: blueviolet;">Ciaz</dt>
      <dd>It is a brown colored manual Diesel car</dd>
    </dl>
  </body>
</html>
